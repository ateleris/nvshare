name: PR checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  c:
    name: C build
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev make

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build with warnings as errors
        run: make -C src EXTRA_CFLAGS=-Werror libnvshare.so nvshare-scheduler nvsharectl

      - name: Check metrics wire format against golden file
        run: |
          gcc -Isrc kubernetes/device-plugin/testdata/gen_wire_golden.c src/common.o -o gen_wire_golden
          ./gen_wire_golden pod | cmp - kubernetes/device-plugin/testdata/pod_stats_golden.bin
          ./gen_wire_golden sched | cmp - kubernetes/device-plugin/testdata/sched_stats_golden.bin

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: nvshare-binaries
          path: |
            src/libnvshare.so
            src/nvshare-scheduler
            src/nvsharectl

  go:
    name: Go build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kubernetes/device-plugin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: kubernetes/device-plugin/go.sum

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

  images:
    name: Build ${{ matrix.dockerfile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - Dockerfile.device_plugin
          - Dockerfile.libnvshare
          - Dockerfile.scheduler
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -f ${{ matrix.dockerfile }} .

  metrics:
    name: Metrics end-to-end test
    runs-on: ubuntu-latest
    container: golang:1.27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run scheduler, device plugin and fake clients
        run: tests/metrics-e2e.sh

  kind:
    name: Kubernetes deployment test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy to a kind cluster and allocate a virtual GPU
        run: tests/kind-e2e.sh

  gpu-test-image:
    name: Build tests/dockerfiles/Dockerfile.gputest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -f tests/dockerfiles/Dockerfile.gputest -t gpu-test .

      - name: Extract test binary
        run: |
          docker create --name gpu-test gpu-test
          docker cp gpu-test:/usr/local/bin/gpu-test gpu-test

      - name: Upload test binary
        uses: actions/upload-artifact@v7
        with:
          name: gpu-test
          path: gpu-test

  gpu:
    name: GPU sharing test
    needs: [c, gpu-test-image]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, gpu]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: bin
          merge-multiple: true

      - name: Run two workloads on one GPU
        run: |
          chmod +x bin/nvshare-scheduler bin/nvsharectl bin/gpu-test
          tests/gpu-e2e.sh bin
