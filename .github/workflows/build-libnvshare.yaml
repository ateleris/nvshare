name: Build libnvshare image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build image
    uses: ./.github/workflows/build-and-upload-image.yaml
    with:
      actor: ${{ github.actor }}
      dockerfile: Dockerfile.libnvshare
      imageTag: libnvshare-latest
    secrets:
      ghToken: ${{ secrets.GITHUB_TOKEN }}
