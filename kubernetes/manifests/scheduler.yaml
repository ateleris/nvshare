apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvshare-scheduler
  namespace: nvshare-system
spec:
  selector:
    matchLabels:
      name: nvshare-scheduler
  template:
    metadata:
      labels:
        name: nvshare-scheduler
    spec:
      priorityClassName: system-node-critical
      # The scheduler looks up the pod of each client process, so tenants
      # cannot report a false pod identity in the metrics.
      hostPID: true
      containers:
      - name: nvshare-scheduler
        image: ghcr.io/ateleris/nvshare:scheduler-v1.3.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: nvshare-socket-directory
            mountPath: /var/run/nvshare
          - name: pod-logs
            mountPath: /var/log/pods
            readOnly: true
      volumes:
        - name: nvshare-socket-directory
          hostPath:
            path: /var/run/nvshare
            type: DirectoryOrCreate
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

